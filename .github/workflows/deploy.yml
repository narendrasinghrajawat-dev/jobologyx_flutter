name: Deploy

# Runs on every push to `test`:
#   1. analyze + test
#   2. build a debug-signed release APK and publish it as a GitHub Release
#      (tag v<pubspec-version>+<run number>, e.g. v1.0.0+42)
#   3. build the Flutter web app and deploy it to GitHub Pages
on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    name: Build & release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Read app version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Release builds are already debug-signed in android/app/build.gradle.kts
      # (no keystore secrets configured), so this produces an installable-for-
      # testing APK, not a Play Store-ready one.
      - name: Build release APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }} 2>&1 | tee build-apk.log

      # Job logs require sign-in to view on this repo, but annotations don't —
      # so on failure, republish the actual failure section (not just the
      # trailing "packages have newer versions" footer flutter always prints)
      # as ::error:: annotations to make the real error visible without auth.
      - name: Surface build failure details
        if: steps.build_apk.outcome == 'failure'
        run: |
          (grep -n -iE "FAILURE:|error:|exception|BUILD FAILED|Execution failed|what went wrong" build-apk.log -A 25 \
            || tail -n 80 build-apk.log) | tail -n 100 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          exit 1

      - name: Rename APK for the release asset
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/jobologyx-${{ steps.version.outputs.tag }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/jobologyx-${{ steps.version.outputs.tag }}.apk

  deploy-web:
    name: Build & deploy web (GitHub Pages)
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Repo is served at https://<owner>.github.io/jobologyx_flutter/, so
      # every asset URL needs that subpath baked in at build time.
      - run: flutter build web --release --base-href /jobologyx_flutter/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
